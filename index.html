<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신무장 생성 · 삼국지 일기토 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
:root {
  --bg: #E7EBE8;
  --surface: #F3F5F2;
  --slip: #D8DFD0;
  --slip-edge: #B7C2AB;
  --ink: #1D2A33;
  --ink-2: #4B5C67;
  --line: #C3CCC6;
  --accent: #2E4B6E;
  --accent-ink: #FFFFFF;
  --gold: #8F6A0E;
  --gold-bg: #F0E2B4;
  --cord: #8A3A2B;
  --node: rgba(30, 42, 30, .08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B;
    --surface: #192027;
    --slip: #26332E;
    --slip-edge: #3B4B43;
    --ink: #E4E8E2;
    --ink-2: #9CAAA4;
    --line: #2B363D;
    --accent: #86A8D2;
    --accent-ink: #0E1419;
    --gold: #DDB95E;
    --gold-bg: #3A3015;
    --cord: #C9684F;
    --node: rgba(0, 0, 0, .22);
  }
}
:root[data-theme="dark"] {
  --bg: #11161B;
  --surface: #192027;
  --slip: #26332E;
  --slip-edge: #3B4B43;
  --ink: #E4E8E2;
  --ink-2: #9CAAA4;
  --line: #2B363D;
  --accent: #86A8D2;
  --accent-ink: #0E1419;
  --gold: #DDB95E;
  --gold-bg: #3A3015;
  --cord: #C9684F;
  --node: rgba(0, 0, 0, .22);
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

h1 { margin: 0; font-size: clamp(34px, 9vw, 48px); font-weight: 900; letter-spacing: .02em; line-height: 1.15; }
h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.lede { margin: 10px 0 28px; color: var(--ink-2); max-width: 34em; }

/* --- slips (죽간) --- */
.slips { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slips::before {
  content: ""; position: absolute; left: -6px; right: -6px; top: 36px; height: 4px;
  background: var(--cord); border-radius: 2px; z-index: 2; pointer-events: none;
}
.slip {
  position: relative; display: flex; flex-direction: column; align-items: center;
  min-height: 268px; padding-top: 56px;
  border: 1px solid var(--slip-edge); border-radius: 4px 4px 14px 14px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.07), transparent 16%, transparent 84%, rgba(0,0,0,.07)),
    repeating-linear-gradient(180deg, transparent 0 74px, var(--node) 74px 76px),
    var(--slip);
  transition: border-color .25s, box-shadow .25s;
}
.slip-name { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.slip-name b { display: flex; flex-direction: column; align-items: center; font-size: 26px; font-weight: 900; line-height: 1.08; }
.slip-name small { color: var(--ink-2); font-size: 14px; }
.slip-num {
  margin-top: auto; padding-bottom: 20px;
  font-size: clamp(40px, 12.5vw, 60px); font-weight: 900; line-height: 1;
  font-variant-numeric: tabular-nums; text-align: center; min-width: 2ch;
}
.slip-num.tumble { opacity: .55; }
.gauge { position: absolute; left: 7px; top: 62px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--node); overflow: hidden; }
.gauge i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--ink-2); transition: height .45s ease; }
.slip.top { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.slip.top .slip-num { color: var(--gold); }
.slip.top .gauge i { background: var(--gold); }

/* --- meter --- */
.meter { margin-top: 20px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.meter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.meter-total { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.meter-total span { color: var(--ink-2); font-size: 16px; font-weight: 400; }
.meter-msg { color: var(--ink-2); font-size: 15px; }
.track { margin-top: 10px; height: 8px; border-radius: 4px; background: var(--node); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .45s ease; }
.meter.full { border-color: var(--gold); background: var(--gold-bg); animation: flash .9s ease-out 1; }
.meter.full .track i { background: var(--gold); }
.meter.full .meter-msg { color: var(--gold); font-weight: 600; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--gold); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* --- buttons --- */
.rollrow { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
.btn {
  appearance: none; font: inherit; font-weight: 600; cursor: pointer;
  min-height: 48px; padding: 0 22px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { flex: 1 1 220px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; min-height: 56px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 24px; height: 24px; flex: none; }
.count { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
:is(.btn, .opt input, .hist button):focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* --- history --- */
.block { margin-top: 36px; }
.hint { margin: -6px 0 12px; color: var(--ink-2); font-size: 14px; }
.hist { list-style: none; margin: 0; padding: 0; max-height: 264px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.hist li + li { border-top: 1px solid var(--line); }
.hist button {
  appearance: none; font: inherit; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 3.2em 1fr auto; align-items: center; gap: 8px;
  padding: 10px 14px; background: transparent; color: var(--ink); border: 0; min-height: 44px;
}
.hist .n { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.hist .v { font-variant-numeric: tabular-nums; font-size: 15px; }
.hist .v em { font-style: normal; color: var(--ink-2); font-size: 13px; margin-right: 2px; }
.hist .v span + span { margin-left: 10px; }
.hist .t { font-weight: 900; font-variant-numeric: tabular-nums; }
.hist li.max .t { color: var(--gold); }
.hist li.cur button { background: var(--node); box-shadow: inset 3px 0 0 var(--accent); }

/* --- choices --- */
.group { margin: 0 0 22px; padding: 0; border: 0; min-width: 0; }
.group legend { padding: 0; margin-bottom: 10px; font-size: 18px; font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { position: relative; display: block; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt .card { display: block; height: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .15s, background .15s; }
.opt .card b { display: block; font-size: 17px; font-weight: 900; }
.opt .card span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.opt.on .card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--node); }
.opt input:focus-visible + .card { outline: 3px solid var(--gold); outline-offset: 2px; }
.note { margin: 0; color: var(--ink-2); font-size: 13px; }

/* --- 이름 입력 --- */
.name-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 420px; }
.fld { display: block; min-width: 0; }
.fld > span { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink-2); }
.fld > span em { font-style: normal; font-size: 12px; opacity: .8; }
.fld input { width: 100%; box-sizing: border-box; padding: 12px 14px; font: inherit; font-size: 18px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.fld input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-color: var(--accent); }
.fld input::placeholder { color: var(--ink-2); opacity: .55; }
.fld .cnt { display: block; margin-top: 4px; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fld .cnt.max { color: var(--gold); font-weight: 700; }
.fld-hint { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
.fld-err { margin: 8px 0 0; color: var(--cord); font-size: 14px; font-weight: 700; }
.sheet .alias { margin: -6px 0 14px; text-align: center; color: var(--ink-2); font-size: 15px; }

/* --- gender --- */
.gender-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 420px; }
.opt.gender .card { padding: 0; overflow: hidden; }
.opt.gender img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; }
.opt.gender .card b { padding: 10px 12px; text-align: center; font-size: 18px; }
.portrait { display: block; width: 100%; max-width: 260px; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; margin: 0 auto 16px; border-radius: 10px; border: 1px solid var(--gold); }

/* --- 육성 --- */
.tr-me { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.tr-me img { width: 72px; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--gold); }
.tr-me b { font-weight: 900; }
.tr-me span { display: block; color: var(--ink-2); font-size: 14px; }
.sheet-stats div.up { animation: pop .7s ease-out 1; }
.sheet-stats div.up strong { color: var(--gold); }
@keyframes pop { 0% { transform: scale(1); box-shadow: 0 0 0 0 var(--gold); } 35% { transform: scale(1.07); box-shadow: 0 0 0 6px transparent; } 100% { transform: scale(1); } }
.tr-ops { margin: 12px 0 0; color: var(--ink-2); font-size: 14px; min-height: 1.5em; }
.tr-ops b { color: var(--ink); font-weight: 900; }
.tr-ops b + b::before { content: ' · '; font-weight: 400; color: var(--ink-2); }
.tr-sub { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.act { appearance: none; font: inherit; text-align: left; cursor: pointer; padding: 12px 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, background .15s; }
.act:hover:not(:disabled) { border-color: var(--accent); }
.act:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act b { display: block; font-size: 17px; font-weight: 900; }
.act span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.tr-log { margin-top: 20px; display: grid; gap: 8px; }
.tr-log p { margin: 0; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; animation: rise .35s ease-out 1; }
.tr-log p small { display: block; color: var(--ink-2); font-size: 13px; }
.tr-log p.gain { border-color: var(--gold); background: var(--gold-bg); }
.tr-log p.gain strong { color: var(--gold); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tr-card { padding: 22px 18px; background: var(--surface); border: 1px solid var(--gold); border-radius: 12px; }
.tr-card h2 { font-size: 22px; font-weight: 900; margin: 0 0 8px; }
.tr-card p { margin: 0; color: var(--ink-2); }
.tr-card dl { margin: 14px 0 0; display: grid; grid-template-columns: 4.5em 1fr; gap: 6px 12px; }
.tr-card dt { color: var(--ink-2); }
.tr-card dd { margin: 0; font-variant-numeric: tabular-nums; }

/* --- 일기토 --- */
.mcard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.fz { text-align: center; min-width: 0; }
.fz .face { width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--node); border: 1px solid var(--line); font-weight: 900; font-size: 26px; }
.fz .face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.fz.me .face { border-color: var(--gold); }
.fz b { display: block; font-size: 18px; font-weight: 900; overflow-wrap: anywhere; }
.fz small { display: block; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.vs { font-weight: 900; font-size: 20px; color: var(--cord); letter-spacing: .05em; }
.hpbar { height: 10px; margin-top: 8px; background: var(--node); border-radius: 5px; overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .35s ease; }
.fz.me .hpbar i { background: var(--gold); }
.hpnum { font-variant-numeric: tabular-nums; font-size: 14px; margin-top: 2px; }
.fz.hurt .face { animation: hurt .35s ease-out 1; }
@keyframes hurt { 0%,100% { transform: none; } 25% { transform: translateX(-4px); background: var(--cord); } 60% { transform: translateX(3px); } }
.bt-ctrl { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.bt-log { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.bt-log li { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; animation: rise .25s ease-out 1; }
.bt-log li.foe { color: var(--ink-2); }
.bt-log li.big { border-color: var(--gold); background: var(--gold-bg); color: var(--ink); font-weight: 700; }
.bt-result { margin: 14px 0; padding: 18px; border-radius: 12px; text-align: center; border: 1px solid var(--line); background: var(--surface); }
.bt-result h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
.bt-result.win { border-color: var(--gold); background: var(--gold-bg); }
.bt-result.win h2 { color: var(--gold); }
.bt-result.lose h2 { color: var(--cord); }
.bt-result p { margin: 0; color: var(--ink-2); }
.others { margin-top: 14px; }
.others summary { cursor: pointer; color: var(--ink-2); padding: 6px 0; }
.others ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.others li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.others li b { font-weight: 900; }

/* --- 육성 결과 연출 --- */
#trStats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding: 8px 0; }
#trStats div { position: relative; }
.gainf { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); pointer-events: none; font-weight: 900; font-size: 26px; color: var(--gold); text-shadow: 0 1px 0 var(--surface), 0 0 10px var(--gold-bg); animation: gainf 1.3s ease-out forwards; }
@keyframes gainf {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
  18% { opacity: 1; transform: translate(-50%, -6px) scale(1.25); }
  35% { transform: translate(-50%, -12px) scale(1); }
  70% { opacity: 1; transform: translate(-50%, -26px); }
  100% { opacity: 0; transform: translate(-50%, -40px); }
}
.op-toast { position: fixed; left: 50%; top: 38%; z-index: 50; transform: translate(-50%, -50%); min-width: 220px; padding: 18px 26px; text-align: center; background: var(--surface); border: 2px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 6px var(--gold-bg), 0 12px 30px rgba(0,0,0,.25); animation: optoast 1.8s ease-out forwards; pointer-events: none; }
.op-toast small { display: block; color: var(--gold); font-weight: 700; letter-spacing: .08em; }
.op-toast b { display: block; margin-top: 4px; font-size: 28px; font-weight: 900; }
@keyframes optoast {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  24% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(.96); }
}
.tr-ops b.new { display: inline-block; animation: pop .8s ease-out 1; color: var(--gold); }

/* --- 지난 화면 보기 --- */
.fz .st3 span { white-space: nowrap; }
.histnav { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.histnav .btn { padding: 8px 14px; font-size: 14px; }
.rv-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 0 16px; padding: 12px 14px; background: var(--gold-bg); border: 1px solid var(--gold); border-radius: 12px; }
.rv-tag { margin: 0 0 8px; font-weight: 700; }
.rv-tag small { display: block; font-weight: 400; color: var(--ink-2); }
.rv-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.rv-btns .btn { padding: 8px 14px; font-size: 14px; }
.review button, .review .bt-ctrl, .review .make { display: none !important; }
.review .bt-log { max-height: none; }

/* --- make + sheet --- */
.make { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
.make .btn { width: 100%; font-size: 18px; min-height: 56px; }
.make p { margin: 0; color: var(--ink-2); font-size: 14px; }
.sheet { margin-top: 32px; padding: 22px 18px; background: var(--surface); border: 1px solid var(--gold); border-radius: 12px; }
.sheet h2 { font-size: 24px; font-weight: 900; margin-bottom: 14px; }
.sheet-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.sheet-stats div { padding: 10px 4px; background: var(--slip); border: 1px solid var(--slip-edge); border-radius: 6px; }
.sheet-stats small { display: block; color: var(--ink-2); font-size: 14px; }
.sheet-stats strong { display: block; font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.sheet-stats .top strong { color: var(--gold); }
.sheet-total { margin: 10px 0 0; text-align: right; color: var(--ink-2); font-size: 14px; }
.sheet dl { margin: 18px 0 0; display: grid; grid-template-columns: 4.5em 1fr; gap: 10px 12px; }
.sheet dt { color: var(--ink-2); }
.sheet dd { margin: 0; }
.sheet dd b { font-weight: 900; }
.sheet dd span { display: block; color: var(--ink-2); font-size: 14px; }
.sheet .btn { margin-top: 20px; }
.sheet .btn + .btn { margin-left: 8px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
<nav class="histnav" id="histNav" hidden>
  <button type="button" class="btn nav" id="navBack">◀ 지난 화면 보기</button>
</nav>
<div id="reviewView" hidden>
  <div class="rv-bar">
    <p class="rv-tag" id="rvTag"></p>
    <div class="rv-btns">
      <button type="button" class="btn nav" id="rvPrev">◀ 이전</button>
      <button type="button" class="btn nav" id="rvNext">다음 ▶</button>
      <button type="button" class="btn primary nav" id="rvLive">지금 화면으로</button>
    </div>
  </div>
  <div class="review" id="rvBody"></div>
</div>
<div id="createView">
  <header>
    <h1>신무장 생성</h1>
    <p class="lede">삼국지 일기토 시뮬레이터. 성별을 고르고, 주사위로 통솔·무력·지력을 정한 뒤, 개성과 사상을 고릅니다.</p>
  </header>

  <section class="block" aria-label="성별" id="genderSec" style="margin-top:0">
    <fieldset class="group">
      <legend>성별</legend>
      <div class="gender-opts" id="genderOpts"></div>
    </fieldset>
  </section>

  <section class="block" aria-label="이름" id="nameSec" style="margin-top:0">
    <fieldset class="group">
      <legend>이름</legend>
      <div class="name-row">
        <label class="fld"><span>이름</span>
          <input id="nameIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="예: 관우">
          <small class="cnt" id="nameCnt">0 / 4</small></label>
        <label class="fld"><span>자(字) <em>선택</em></span>

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// 이번 굴림의 합계 결정 (160은 천천히 차오르는 확률로)
function drawTotal() {
  state.sinceMax++;
  const p = CFG.pity[Math.min(state.sinceMax, CFG.pity.length - 1)];
  if (Math.random() < p) { state.sinceMax = 0; return CFG.cap; }
  const d = 1 + Math.floor(-Math.log(1 - Math.random()) * CFG.shortMean);
  return CFG.cap - Math.min(d, CFG.shortCap);
}

// 합계를 세 능력치로 쪼갠다 (각 min~max)
function split(total) {
  const stats = [CFG.min, CFG.min, CFG.min];
  let rem = total - CFG.min * 3;
  const w = [0, 0, 0].map(() => Math.pow(Math.random(), 1.4) + 0.08);
  w[1] *= CFG.mightBias;   // 무력 위주
  let open = [0, 1, 2];
  while (rem > 0 && open.length) {
    const ws = open.reduce((a, i) => a + w[i], 0);
    let given = 0;
    for (const i of open) {
      const add = Math.min(Math.floor(rem * w[i] / ws), CFG.max - stats[i]);
      stats[i] += add; given += add;
    }
    rem -= given;
    if (given === 0) {
      for (const i of shuffle(open)) { if (rem > 0 && stats[i] < CFG.max) { stats[i]++; rem--; } }
    }
    open = open.filter(i => stats[i] < CFG.max);
  }
  return stats;
}

/* ---------- 이름 / 자 ---------- */
const NAME_MAX = 4, NAME_BYTES = 8;
const NAME_BAD = /[^가-힣ㄱ-ㅎㅏ-ㅣ一-鿿A-Za-z0-9]/g;     // 한글·한자·영문·숫자만
function byteLen(str) { let b = 0; for (const ch of str) b += ch.charCodeAt(0) < 128 ? 1 : 2; return b; }
function cleanName(v) {
  let out = '';
  for (const ch of v.replace(NAME_BAD, '')) {
    if ([...out].length >= NAME_MAX || byteLen(out + ch) > NAME_BYTES) break;
    out += ch;
  }
  return out;
}
function bindName(inputId, cntId, key) {
  const inp = $(inputId), cnt = $(cntId);
  const paint = () => { const n = [...inp.value].length; cnt.textContent = n + ' / ' + NAME_MAX; cnt.classList.toggle('max', n >= NAME_MAX); };
  const apply = () => {
    const c = cleanName(inp.value);
    if (c !== inp.value) inp.value = c;
    state[key] = c; paint(); hideSheet(); if (key === 'name') paintNameErr(); renderMake();
  };
  inp.addEventListener('input', e => { if (e.isComposing) { paint(); return; } apply(); });   // 한글 조합 중에는 자르지 않음
  inp.addEventListener('compositionend', apply);
  inp.addEventListener('blur', apply);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); inp.blur(); const nx = inputId === '#nameIn' ? $('#styleIn') : null; if (nx) nx.focus(); } });
  paint();
}
function nameTaken(n) { return !!n && NPC_TABLE.some(x => x.name === n); }   // 대회에 나오는 장수 이름과 겹치는지
function paintNameErr() {
  const bad = nameTaken(state.name), e = $('#nameErr');
  e.hidden = !bad; e.textContent = bad ? josa(state.name, '은', '는') + ' 이미 대회에 나오는 장수 이름이에요. 다른 이름을 써 주세요.' : '';
  $('#nameIn').setAttribute('aria-invalid', bad ? 'true' : 'false');
}
function playerLabel() { return state.name + (state.style ? ' (자 ' + state.style + ')' : ''); }

function missing() {
  const m = [];
  if (!state.gender) m.push('성별');
  if (!state.name || nameTaken(state.name)) m.push('이름');
  if (!state.stats) m.push('능력치');
  Object.entries(TABLES).forEach(([k, t]) => { if (!state.pick[k]) m.push(t.label); });
  return m;
}
function renderMake() {
  const m = missing();
  $('#make').disabled = m.length > 0;
  let hint = m.length ? '' : '이 구성으로 신무장을 생성합니다.';
  const best = state.history.reduce((a, h) => Math.max(a, h.total), 0);
  if (state.stats && best > state.total) hint = '굴린 기록에 합계 ' + best + '인 결과가 있어요. 기록을 눌러 고를 수 있습니다.';
  $('#makeHint').textContent = hint;
}

/* ---------- 동작 ---------- */
function tumble(el, finalVal, ms, done) {
  if (reduce) { el.textContent = finalVal; done(); return; }
  el.classList.add('tumble');
  const t0 = performance.now();
  const id = setInterval(() => {
    if (performance.now() - t0 >= ms) {
      clearInterval(id); el.classList.remove('tumble'); el.textContent = finalVal; done(); return;
    }
    el.textContent = CFG.min + Math.floor(Math.random() * (CFG.max - CFG.min + 1));
  }, 45);
}

function roll() {
  if (state.rolling) return;
  state.rolling = true; $('#roll').disabled = true; hideSheet();
  slipEls.forEach(s => s.classList.remove('top'));
  const total = drawTotal();
  const stats = split(total);
  state.rolls++;
  let left = 3;
  stats.forEach((v, i) => tumble(numEls[i], v, CFG.tumbleMs[i], () => {
    if (--left === 0) settle(stats, total);
  }));
}

function settle(stats, total) {
  state.stats = stats; state.total = total;
  const entry = { id: state.rolls, stats, total };
  state.history.unshift(entry); state.activeId = entry.id;
  state.rolling = false; $('#roll').disabled = false;
  renderStats(); renderHistory(); renderCount(); renderMake();
  $('#live').textContent = `통솔 ${stats[0]}, 무력 ${stats[1]}, 지력 ${stats[2]}. 합계 ${total}.`;
}

function restore(id) {
  if (state.rolling) return;
  const h = state.history.find(x => x.id === id); if (!h) return;
  state.stats = h.stats; state.total = h.total; state.activeId = id;
  hideSheet(); renderStats(); renderHistory(); renderMake();
  $('#live').textContent = `${id}번째 결과로 되돌렸습니다. 합계 ${h.total}.`;
}

function hideSheet() { $('#sheet').hidden = true; }

function showSheet() {
  const sh = $('#sheet'); sh.textContent = '';
  const s = state.stats, mx = Math.max(...s);
  const h = document.createElement('h2'); h.textContent = state.name; sh.appendChild(h);
  if (state.style) sh.appendChild(el('p', 'alias', '자 ' + state.style));
  const pt = document.createElement('img'); pt.className = 'portrait'; pt.src = PORTRAITS[state.gender];
  pt.alt = state.name; sh.appendChild(pt);

  const grid = document.createElement('div'); grid.className = 'sheet-stats';
  STAT_NAMES.forEach((n, i) => {
    const d = document.createElement('div'); if (s[i] === mx) d.className = 'top';
    const sm = document.createElement('small'); sm.textContent = n;
    const st = document.createElement('strong'); st.textContent = s[i];
    d.append(sm, st); grid.appendChild(d);
  });
  sh.appendChild(grid);
  const tot = document.createElement('p'); tot.className = 'sheet-total'; tot.textContent = `합계 ${state.total} / ${CFG.cap}`; sh.appendChild(tot);

  const dl = document.createElement('dl');
  Object.entries(TABLES).forEach(([k, t]) => {
    const it = t.items.find(x => x.id === state.pick[k]);
    const dt = document.createElement('dt'); dt.textContent = t.label;
    const dd = document.createElement('dd');
    const b = document.createElement('b'); b.textContent = it.name;
    const sp = document.createElement('span'); sp.textContent = it.desc;
    dd.append(b, sp); dl.append(dt, dd);
  });
  { // 작전은 생성 시 고를 수 없고 육성 중 무작위로 얻음
    const dt = document.createElement('dt'); dt.textContent = '작전';
    const dd = document.createElement('dd');
    const b = document.createElement('b'); b.textContent = '없음';
    const sp = document.createElement('span'); sp.textContent = '육성하며 무작위로 얻습니다';
    dd.append(b, sp); dl.append(dt, dd);
  }
  sh.appendChild(dl);

  const go = document.createElement('button'); go.type = 'button'; go.className = 'btn primary'; go.textContent = '육성 시작';
  go.addEventListener('click', () => { snap(); startTrain(); }); sh.appendChild(go);
  const again = document.createElement('button'); again.type = 'button'; again.className = 'btn'; again.textContent = '처음부터 다시';
  again.addEventListener('click', resetAll); sh.appendChild(again);

  sh.hidden = false;
  sh.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function resetAll() {
  Object.assign(state, { stats: null, total: 0, rolls: 0, sinceMax: 0, history: [], activeId: null, pick: { trait: null, ideology: null }, gender: null, name: '', style: '' });
  document.querySelectorAll('#choices input, #genderOpts input').forEach(i => { i.checked = false; });
  $('#nameIn').value = ''; $('#styleIn').value = ''; $('#nameCnt').textContent = '0 / ' + NAME_MAX; $('#styleCnt').textContent = '0 / ' + NAME_MAX;
  $('#nameCnt').classList.remove('max'); $('#styleCnt').classList.remove('max'); paintNameErr();
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('on'));
  hideSheet(); renderStats(); renderHistory(); renderCount(); renderMake();
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}

/* ============================================================
   육성
   ============================================================ */
const train = { n: 0, act: 0, stats: [], base: [], ops: [], busy: false, results: [] };
const IDX = { 통솔: 0, 무력: 1, 지력: 2 };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pickedItem(k) { return TABLES[k].items.find(x => x.id === state.pick[k]); }

function startTrain() {
  train.n = 0; train.act = 0; train.busy = false;
  train.stats = state.stats.slice(); train.base = state.stats.slice(); train.ops = []; train.results = [];
  $('#createView').hidden = true; $('#trainView').hidden = false;
  renderMe(); renderTrainStats(); renderOps(); renderSession();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderMe() {
  const box = $('#trMe'); box.textContent = '';
  const img = el('img'); img.src = PORTRAITS[state.gender]; img.alt = state.name;
  const t = el('div'); const tr = pickedItem('trait'), id = pickedItem('ideology');
  t.append(el('b', null, playerLabel()), el('span', null, '개성 ' + tr.name + ' · 사상 ' + id.name));
  box.append(img, t);
}
function renderTrainStats(upIdx, vals) {
  const v = vals || train.stats;
  const g = $('#trStats'); g.textContent = '';
  const mx = Math.max(...v);
  STAT_NAMES.forEach((n, i) => {
    const d = el('div'); if (v[i] === mx) d.classList.add('top'); if (i === upIdx) d.classList.add('up');
    d.append(el('small', null, n), el('strong', null, v[i]));
    g.appendChild(d);
  });
}
function renderOps(newOp) {
  const o = $('#trOps'); o.textContent = '';
  if (!train.ops.length) { o.textContent = '획득한 작전 없음'; return; }
  o.append('획득한 작전  ');
  train.ops.forEach(op => o.appendChild(el('b', op === newOp ? 'new' : null, op.name)));
}

function sessionLabel() {
  return '육성 ' + (train.n + 1) + ' / ' + CFG.schedule.length + ' · 일기토 대회 ' + CFG.schedule[train.n] + '회차 전';
}

// 이번 행동에 보여줄 선택지 (choiceCount가 전체보다 작으면 무작위로 뽑음)
function pickChoices() {
  return CFG.choiceCount >= TRAIN.length ? TRAIN : shuffle(TRAIN).slice(0, CFG.choiceCount);
}

function renderSession() {
  const left = CFG.actionsPerSession - train.act;
  $('#trLede').textContent = sessionLabel();
  const box = $('#trAct'); box.textContent = '';
  $('#trNext').textContent = '';
  if (train.act === 0) $('#trLog').textContent = '';
  box.appendChild(el('p', 'tr-sub', '남은 행동 ' + left + '회 — 하나를 고르세요.'));
  const grid = el('div', 'acts');
  pickChoices().forEach(opt => {
    const b = el('button', 'act'); b.type = 'button';
    b.append(el('b', null, opt.name), el('span', null, opt.desc));
    b.addEventListener('click', () => act(opt));
    grid.appendChild(b);
  });
  box.appendChild(grid);
}

// 한 번의 행동 결과를 결정
function resolve(opt) {
  const bonus = pickedItem('ideology').grow || {};
  const sb = CFG.growBonus[train.n] || { stat: 0, op: 0 };      // 이번 육성 회차 보정
  const gain = opt.gain > 0 ? opt.gain + sb.stat : 0;
  const outs = [];
  Object.entries(opt.to).forEach(([si, w]) => {
    const st = +si, lv = bonus[st];
    outs.push({ type: 'stat', stat: st, p: gain * w + (lv ? CFG.bonus[lv] : 0) });
  });
  if (opt.op) outs.push({ type: 'op', p: opt.op + sb.op });
  let r = Math.random();
  for (const o of outs) { if (r < o.p) return o; r -= o.p; }
  return { type: 'none' };
}

function act(opt) {
  if (train.busy) return; train.busy = true;
  const out = resolve(opt);
  let msg = '이번에는 뚜렷한 소득이 없었습니다.', cls = '', up = null, addN = 0, got = null;
  const prev = train.stats.slice();
  if (out.type === 'stat') {
    const cur = train.stats[out.stat], add = Math.min(CFG.gain, CFG.growMax - cur);
    if (add > 0) { train.stats[out.stat] = cur + add; up = out.stat; addN = add; msg = STAT_NAMES[out.stat] + '이 올랐습니다. (+' + add + ')'; cls = 'gain'; }
  } else if (out.type === 'op') {
    const free = OPS.filter(o => !train.ops.some(h => h.id === o.id));   // 중복 획득 방지
    if (free.length) {
      got = free[Math.floor(Math.random() * free.length)];
      train.ops.push(got); msg = '작전 「' + got.name + '」' + josa(got.name, '을', '를').slice(got.name.length) + ' 얻었습니다.'; cls = 'gain';
    }
  }
  const line = el('p', cls); line.append(el('small', null, opt.name));
  if (cls) line.appendChild(el('strong', null, msg)); else line.append(msg);
  $('#trLog').appendChild(line);
  train.act++;
  document.querySelectorAll('#trAct .act').forEach(b => { b.disabled = true; });
  let wait = 650;
  if (up !== null && !reduce) {
    // +2가 떠올랐다 사라지는 사이에 능력치 숫자가 올라감
    renderTrainStats(null, prev);
    const chip = $('#trStats').children[up];
    chip.appendChild(el('span', 'gainf', '+' + addN));
    setTimeout(() => {
      const st = chip.querySelector('strong'); st.textContent = train.stats[up];
      chip.classList.remove('up'); void chip.offsetWidth; chip.classList.add('up');
    }, 650);
    setTimeout(() => renderTrainStats(), 1350);
    wait = 1400;
  } else renderTrainStats(up);
  if (got && !reduce) {
    const t = el('div', 'op-toast'); t.setAttribute('role', 'status');
    t.append(el('small', null, '작전 획득'), el('b', null, got.name));
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1850);
    setTimeout(() => renderOps(got), 500);
    wait = 1900;
  } else renderOps(got);
  const done = train.act >= CFG.actionsPerSession;
  setTimeout(() => { train.busy = false; done ? endSession() : renderSession(); }, reduce ? 0 : wait);
}

function endSession() {
  $('#trAct').textContent = '';
  const t = CFG.schedule[train.n], last = train.n === CFG.schedule.length - 1;
  const goTournament = last || CFG.schedule[train.n + 1] !== t;
  const nx = $('#trNext'); nx.textContent = '';
  const b = el('button', 'btn primary', goTournament ? '일기토 대회 ' + t + '회차로' : '다음 육성으로'); b.type = 'button';
  b.addEventListener('click', () => { snap(); goTournament ? tournament(t) : nextSession(); });
  nx.appendChild(b);
}
function nextSession() { train.n++; train.act = 0; renderSession(); window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }

/* ============================================================
   일기토 엔진: 같은 규칙으로 내 경기(기록 포함)와 다른 경기(결과만)를 모두 계산
   ============================================================ */
function makeRng(seed) {           // 시드 기반 랜덤 (나중에 점수 재검증용)
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// 한글 조사: 받침 있으면 a, 없으면 b
function josa(word, a, b) {
  const c = word.charCodeAt(word.length - 1);
  return word + ((c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b);
}
const OP_NAME = Object.fromEntries(OPS.map(o => [o.id, o.name]));
const TRAIT_LINE = { charge: '돌격!', kiai: '기합을 넣는다!', assault: '맹공을 퍼붓는다!', watch: '상대를 날카롭게 주시한다.' };

function duel(F, seed, wantLog) {
  const B = BATTLE, rng = makeRng(seed);
  const hp = [B.hp, B.hp], buf = [{}, {}], endure = [0, 0], used = [false, false];
  const ev = F.map(f => clamp(B.evade + (f.stats[2] - 50) * B.intCoef, B.evadeMin, B.evadeMax));
  const cr = F.map(f => clamp(B.crit + (f.stats[2] - 50) * B.intCoef, B.critMin, B.critMax));
  const tp = F.map(f => B.traitBase + (f.stats[0] + f.stats[2]) * B.traitCoef);
  const pct = i => hp[i] / B.hp * 100;
  const N = i => F[i].name;
  const log = [];
  const L = (t, who, text, big) => { if (wantLog) log.push({ t, who, text, big: !!big, hp: hp.slice() }); };

  function hit(i, j, t) {
    const me = F[i].trait, op = F[j].trait, notes = [];
    let hi = false;
    if (TRAIT_LINE[me] && rng() < tp[i] * (me === 'charge' ? B.chargeRate : 1)) {
      if (me === 'charge') hi = true; else buf[i][me] = t + B.buffSec;
      notes.push(me);
    }
    let crit = cr[i], dm = 1;
    if (me === 'valor' && pct(i) >= 80) crit *= 3;
    if (me === 'cunning' && pct(i) >= 50) dm *= 1.05;
    if ((buf[i].kiai || 0) > t) dm *= 1.05;
    if ((buf[i].assault || 0) > t) { dm *= 1.05; crit *= 1.5; }
    let cdef = B.critDef, taken = 1;
    if (op === 'prudent' && pct(j) <= 80) cdef *= 3;
    if (op === 'iki' && pct(j) <= 50) taken /= 1.05;
    if ((buf[j].watch || 0) > t) { taken /= 1.05; cdef *= 1.5; }
    if (rng() < ev[j]) return { d: 0, type: 'evade', notes };
    const f = clamp(1 + (F[i].stats[1] - F[j].stats[0]) * B.statCoef, B.dmgMin, B.dmgMax);
    let d = B.baseDmg * f * (1 - B.dmgVar + rng() * 2 * B.dmgVar) * dm * taken, type = 'hit';
    if (rng() < Math.min(1, crit)) {
      if (rng() >= Math.min(1, cdef)) { d *= hi ? B.critMultHi : B.critMult; type = hi ? 'hicrit' : 'crit'; }
      else type = 'block';
    }
    let en = false;
    if (endure[j] > 0) { d = 1; endure[j]--; en = true; }
    return { d, type, notes, en };
  }
  function logHit(i, j, r, t) {
    r.notes.forEach(n => L(t, i, '[' + TABLES.trait.items.find(x => x.id === n).name + '] ' + N(i) + ', ' + TRAIT_LINE[n], true));
    const dn = Math.max(1, Math.round(r.d)), en = r.en ? ' (인내로 버팀)' : '';
    if (r.type === 'evade') L(t, i, N(j) + ', ' + N(i) + '의 공격을 피했다.');
    else if (r.type === 'hit') L(t, i, N(i) + '의 공격 — ' + N(j) + '에게 ' + dn + ' 피해' + en);
    else if (r.type === 'crit') L(t, i, '치명타! ' + N(i) + '의 일격 — ' + N(j) + '에게 ' + dn + ' 피해' + en, true);
    else if (r.type === 'hicrit') L(t, i, '상급 치명타! ' + N(i) + '의 돌격 — ' + N(j) + '에게 ' + dn + ' 피해' + en, true);
    else if (r.type === 'block') L(t, i, N(j) + ', 치명타를 막아냈다 — ' + dn + ' 피해' + en);
  }
  function opTry(i, j, t) {
    if (used[i] || !F[i].ops.length) return null;
    if (F[i].ops.includes('resolve') && hp[j] - hp[i] >= B.resolveGap && rng() < B.resolveRate) {
      used[i] = true; L(t, i, '[작전 결사] ' + N(i) + ', 목숨을 걸고 달려든다!', true); return 'win';
    }
    const c = F[i].ops.filter(o => o === 'deathblow' || o === 'lure' || o === 'endure');
    if (!c.length || rng() >= F[i].stats[2] * B.opCoef) return null;
    const o = c[Math.floor(rng() * c.length)]; used[i] = true;
    if (o === 'deathblow') {
      if (F[j].ops.includes('counter')) { hp[i] *= 0.5; L(t, i, '[작전 일격필살] ' + N(i) + '의 필살의 일격! — [작전 반격] ' + N(j) + ', 받아쳤다! ' + N(i) + '의 체력이 절반으로', true); }
      else if (endure[j] > 0) { hp[j] -= 1; endure[j]--; L(t, i, '[작전 일격필살] ' + N(i) + '의 필살의 일격! — ' + N(j) + ', 인내로 버텼다', true); }
      else { hp[j] *= 0.5; L(t, i, '[작전 일격필살] ' + N(i) + '의 필살의 일격! ' + N(j) + '의 체력이 절반으로', true); }
    } else if (o === 'lure') {
      if (endure[j] > 0) { hp[j] -= 1; endure[j]--; L(t, i, '[작전 유인] ' + N(i) + ', 물러서는 척 유인했다 — ' + N(j) + ', 인내로 버텼다', true); }
      else { hp[j] -= 20; L(t, i, '[작전 유인] ' + N(i) + ', 물러서는 척 유인했다 — ' + N(j) + '에게 20 피해', true); }
    } else if (o === 'endure') { endure[i] = 3; L(t, i, '[작전 인내] ' + N(i) + ', 이를 악물고 버틴다', true); }
    return null;
  }

  for (let i = 0; i < 2; i++) {
    if (F[i].ops.includes('first') && rng() < F[i].stats[2] * B.firstCoef) {
      const r = hit(i, 1 - i, 0.6); hp[1 - i] -= r.d;
      L(0.6, i, '[작전 선제공격] ' + N(i) + ', 먼저 치고 들어간다!', true); logHit(i, 1 - i, r, 0.6);
    }
  }
  let t = B.tick, timeUp = false, resolveWin = null;
  while (hp[0] > 0 && hp[1] > 0) {
    if (t > B.timeLimit) { timeUp = true; break; }
    const r0 = opTry(0, 1, t), r1 = opTry(1, 0, t);
    if (r0 === 'win' && r1 !== 'win') { resolveWin = 0; break; }
    if (r1 === 'win' && r0 !== 'win') { resolveWin = 1; break; }
    if (hp[0] <= 0 || hp[1] <= 0) break;
    const a = hit(0, 1, t), b = hit(1, 0, t);
    hp[1] -= a.d; hp[0] -= b.d;
    logHit(0, 1, a, t); logHit(1, 0, b, t);
    t += B.tick;
  }
  let w = resolveWin;
  if (w === null) w = hp[0] > hp[1] ? 0 : hp[1] > hp[0] ? 1 : (rng() < 0.5 ? 0 : 1);
  const survived = resolveWin === null && hp[w] <= 0;     // 동시에 쓰러졌지만 버텨냄
  if (survived) hp[w] = 1;
  if (resolveWin !== null) hp[1 - w] = 0;
  return { winner: w, log, hp: hp.map(h => Math.max(0, h)), timeUp, survived, resolve: resolveWin !== null, end: Math.min(t, B.timeLimit) };
}

/* ============================================================
   일기토 대회 (32강 단판 토너먼트)
   ============================================================ */
const tour = { round: 0, stage: 0, alive: [], speed: 2, timer: null, place: '' };
const SPEEDS = [1, 2, 2.5];

function makeNpcs(r) {
  const seen = new Set(), pool = NPC_TABLE.filter(n => n.name !== state.name && !seen.has(n.name) && seen.add(n.name));
  const pick = shuffle(pool).slice(0, 31);
  while (pick.length < 31) pick.push({ name: '무명 장수 ' + (pick.length + 1), stats: [45, 45, 45], trait: TABLES.trait.items[0].id, op: '' });
  const bonus = TOUR.statBonus[r - 1], oc = TOUR.opChance[r - 1];
  return pick.map(n => ({
    name: n.name,
    stats: n.stats.map(v => clamp(v + bonus, CFG.min, 100)),
    trait: n.trait,
    ops: n.op && Math.random() < oc ? [n.op] : [],
    forfeit: false
  }));
}
function playerFighter() {
  return { name: state.name, alias: state.style, stats: train.stats.slice(), trait: state.pick.trait, ops: train.ops.map(o => o.id), forfeit: false, me: true };
}
const seed = () => (Math.random() * 4294967296) >>> 0;

function tournament(round) {
  tour.round = round; tour.stage = 0; tour.place = '';
  tour.alive = shuffle([playerFighter(), ...makeNpcs(round)]);
  $('#trainView').hidden = true; $('#tourView').hidden = false;
  $('#tvTitle').textContent = '일기토 대회 ' + round + '회차';
  showStage();
}
function pairs() { const p = []; for (let i = 0; i < tour.alive.length; i += 2) p.push([tour.alive[i], tour.alive[i + 1]]); return p; }
function myPair() { return pairs().find(p => p[0].me || p[1].me); }
function traitName(id) { return TABLES.trait.items.find(x => x.id === id).name; }

function statLine(st) {
  const sm = el('small', 'st3');
  STAT_NAMES.forEach((n, i) => { if (i) sm.append(' · '); sm.appendChild(el('span', null, n + ' ' + st[i])); });
  return sm;
}
function fighterBox(f, side) {
  const box = el('div', 'fz' + (f.me ? ' me' : '')); box.dataset.side = side;
  const face = el('div', 'face');
  if (f.me) { const img = el('img'); img.src = PORTRAITS[state.gender]; img.alt = ''; face.appendChild(img); }
  else face.textContent = f.name[0];
  box.append(face, el('b', null, f.name), ...(f.alias ? [el('small', null, '자 ' + f.alias)] : []),
    statLine(f.stats),
    el('small', null, '개성 ' + traitName(f.trait)));
  const bar = el('div', 'hpbar'); bar.appendChild(el('i'));
  box.append(bar, el('div', 'hpnum', BATTLE.hp + ' / ' + BATTLE.hp));
  return box;
}
function matchCard(p) {
  const c = el('div', 'mcard');
  c.append(fighterBox(p[0], 0), el('div', 'vs', 'VS'), fighterBox(p[1], 1));
  return c;
}

function showStage() {
  clearTimeout(tour.timer);
  const main = $('#tvMain'); main.textContent = '';
  $('#tvLede').textContent = TOUR.rounds[tour.stage];
  const p = myPair();
  const foe = p[0].me ? p[1] : p[0], me = p[0].me ? p[0] : p[1];
  main.appendChild(matchCard(p));
  const ctl = el('div', 'make');
  if (me.forfeit) {
    ctl.appendChild(el('p', 'tr-sub', '결사의 대가로 이번 경기에 나설 수 없습니다.'));
    const b = el('button', 'btn primary', '결과 보기'); b.type = 'button';
    b.addEventListener('click', () => { snap(); finishStage({ winner: p[0].me ? 1 : 0, forfeit: true }); });
    ctl.appendChild(b);
  } else if (foe.forfeit) {
    ctl.appendChild(el('p', 'tr-sub', foe.name + ', 결사의 대가로 경기에 나서지 못합니다.'));
    const b = el('button', 'btn primary', '부전승으로 진출'); b.type = 'button';
    b.addEventListener('click', () => { snap(); finishStage({ winner: p[0].me ? 0 : 1, forfeit: true }); });
    ctl.appendChild(b);
  } else {
    const b = el('button', 'btn primary', '경기 시작'); b.type = 'button';
    b.addEventListener('click', () => playMatch(p));
    ctl.appendChild(b);
  }
  main.appendChild(ctl);
}

function playMatch(p) {
  const main = $('#tvMain');
  const card = main.querySelector('.mcard');
  main.textContent = ''; main.appendChild(card);
  const res = duel(p, seed(), true);
  const ctl = el('div', 'bt-ctrl');
  const spBtns = SPEEDS.map(v => {
    const b = el('button', 'btn', v + '배속'); b.type = 'button'; b.setAttribute('aria-pressed', String(tour.speed === v));
    if (tour.speed === v) b.classList.add('primary');
    b.addEventListener('click', () => {
      tour.speed = v;
      spBtns.forEach((x, k) => { x.classList.toggle('primary', SPEEDS[k] === v); x.setAttribute('aria-pressed', String(SPEEDS[k] === v)); });
    });
    return b;
  });
  const sk = el('button', 'btn', '결과 바로 보기'); sk.type = 'button';
  ctl.append(...spBtns, sk); main.appendChild(ctl);
  const ul = el('ul', 'bt-log'); main.appendChild(ul);
  const meIdx = p[0].me ? 0 : 1;
  const groups = [];
  res.log.forEach(e => { const g = groups[groups.length - 1]; if (g && g.t === e.t) g.items.push(e); else groups.push({ t: e.t, items: [e] }); });
  let gi = 0, done = false;
  const sides = card.querySelectorAll('.fz');
  function setHp(hp, hurt) {
    sides.forEach((s, k) => {
      const v = Math.max(0, Math.ceil(hp[k]));
      s.querySelector('.hpbar i').style.width = clamp(v / BATTLE.hp * 100, 0, 100) + '%';
      s.querySelector('.hpnum').textContent = v + ' / ' + BATTLE.hp;
      if (hurt && hurt[k] && !reduce) { s.classList.remove('hurt'); void s.offsetWidth; s.classList.add('hurt'); }
    });
  }
  let last = [BATTLE.hp, BATTLE.hp];
  function showGroup(g) {
    g.items.forEach(e => {
      const li = el('li', (e.who !== meIdx ? 'foe' : '') + (e.big ? ' big' : ''), e.text);
      ul.prepend(li);
    });
    const hp = g.items[g.items.length - 1].hp;
    setHp(hp, [hp[0] < last[0], hp[1] < last[1]]); last = hp;
  }
  function step() {
    if (done) return;
    if (gi >= groups.length) return finish();
    showGroup(groups[gi++]);
    tour.timer = setTimeout(step, BATTLE.tick * 1000 / tour.speed);
  }
  function finish() {
    if (done) return; done = true; clearTimeout(tour.timer);
    while (gi < groups.length) showGroup(groups[gi++]);
    setHp(res.hp); ctl.remove();
    const win = res.winner === meIdx, foe = p[1 - meIdx];
    const box = el('div', 'bt-result ' + (win ? 'win' : 'lose'));
    box.appendChild(el('h2', null, win ? '승리!' : '패배'));
    let note = win ? josa(foe.name, '을', '를') + ' 꺾었습니다.' : foe.name + '에게 패했습니다.';
    if (res.resolve) note = (res.winner === meIdx ? '결사로 승리했습니다. 다음 경기에는 나설 수 없습니다.' : foe.name + '의 결사에 무너졌습니다.');
    else if (res.survived) note = (win ? '마지막 일격을 버텨내고 승리했습니다.' : josa(foe.name, '이', '가') + ' 마지막 일격을 버텨냈습니다.');
    else if (res.timeUp) note = '시간 종료 — 남은 체력으로 승부가 갈렸습니다.';
    box.appendChild(el('p', null, note));
    main.insertBefore(box, ul);
    const b = el('button', 'btn primary', '계속'); b.type = 'button';
    b.addEventListener('click', () => { snap(); finishStage(res); });
    const wrap = el('div', 'make'); wrap.appendChild(b); main.insertBefore(wrap, ul);
  }
  sk.addEventListener('click', finish);
  if (reduce) finish(); else step();
}

// 이번 라운드의 나머지 경기를 계산하고 다음 라운드로
function runOthers(skipPair) {
  const results = [], next = [];
  pairs().forEach(p => {
    if (skipPair && p[0] === skipPair[0]) return;
    let w;
    if (p[0].forfeit && !p[1].forfeit) w = 1;
    else if (p[1].forfeit && !p[0].forfeit) w = 0;
    else { const r = duel(p, seed(), false); w = r.winner; p[w].nextForfeit = r.resolve; }
    results.push({ p, w });
  });
  return results;
}
function advance(results) {
  const order = new Map(results.map(r => [r.p[0], r.p[r.w]]));
  const nxt = [];
  pairs().forEach(p => { const w = order.get(p[0]); w.forfeit = TOUR.resolveSkipsNext && !!w.nextForfeit; w.nextForfeit = false; nxt.push(w); });
  tour.alive = nxt; tour.stage++;
}

function finishStage(res) {
  const p = myPair(), meIdx = p[0].me ? 0 : 1;
  if (!res.forfeit) p[res.winner].nextForfeit = res.resolve;
  const others = runOthers(p);
  const all = [{ p, w: res.winner }, ...others];
  const win = res.winner === meIdx;
  const stageName = TOUR.rounds[tour.stage];
  advance(all);
  if (!win) {
    tour.place = stageName === '결승' ? '준우승' : stageName + ' 탈락';
    return endTournament(all);
  }
  if (tour.alive.length === 1) { tour.place = '우승'; return endTournament(all); }
  // 다음 라운드 안내 + 이번 라운드 다른 경기 결과
  const main = $('#tvMain'); main.textContent = '';
  $('#tvLede').textContent = stageName + ' 통과';
  main.appendChild(othersList(others, stageName));
  const b = el('button', 'btn primary', TOUR.rounds[tour.stage] + ' 진행'); b.type = 'button';
  b.addEventListener('click', () => { snap(); showStage(); });
  const wrap = el('div', 'make'); wrap.appendChild(b); main.prepend(wrap);
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function othersList(list, stageName) {
  const d = el('details', 'others');
  d.appendChild(el('summary', null, stageName + ' 다른 경기 결과 (' + list.length + ')'));
  const ul = el('ul');
  list.forEach(({ p, w }) => {
    const li = el('li');
    li.append(el('b', null, p[w].name), ' 승 — ' + p[1 - w].name);
    ul.appendChild(li);
  });
  d.appendChild(ul); return d;
}

// 내가 탈락하거나 우승하면 남은 경기를 모두 계산해서 우승자를 정함
function endTournament(lastResults) {
  while (tour.alive.length > 1) { const r = runOthers(null); advance(r); }
  const champ = tour.alive[0];
  train.results.push({ round: tour.round, place: tour.place });
  const main = $('#tvMain'); main.textContent = '';
  $('#tvLede').textContent = '대회 종료';
  const box = el('div', 'bt-result ' + (tour.place === '우승' ? 'win' : ''));
  box.append(el('h2', null, tour.place === '우승' ? '우승!' : tour.place),
             el('p', null, tour.place === '우승' ? '일기토 대회 ' + tour.round + '회차의 정상에 섰습니다.' : '이번 대회 우승: ' + champ.name));
  main.appendChild(box);
  const last = tour.round === CFG.schedule[CFG.schedule.length - 1];
  const b = el('button', 'btn primary', last || (TOUR.endOnLoss && tour.place !== '우승') ? '결과 보기' : '다음 육성으로'); b.type = 'button';
  b.addEventListener('click', () => {
    snap();
    $('#tourView').hidden = true; $('#trainView').hidden = false;
    if (TOUR.endOnLoss && tour.place !== '우승') return finishTrain();
    afterTournament();
  });
  const wrap = el('div', 'make'); wrap.appendChild(b); main.appendChild(wrap);
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function afterTournament() {
  if (train.n >= CFG.schedule.length - 1) return finishTrain();
  nextSession();
}

function finishTrain() {
  $('#trLede').textContent = '모든 일정을 마쳤습니다';
  $('#trNext').textContent = ''; $('#trLog').textContent = '';
  const box = $('#trAct'); box.textContent = '';
  const card = el('div', 'tr-card'); card.appendChild(el('h2', null, '최종 결과'));
  const dl = el('dl');
  STAT_NAMES.forEach((n, i) => {
    const d = train.stats[i] - train.base[i];
    dl.append(el('dt', null, n), el('dd', null, train.base[i] + ' → ' + train.stats[i] + (d ? '  (+' + d + ')' : '')));
  });
  dl.append(el('dt', null, '작전'), el('dd', null, train.ops.length ? train.ops.map(o => o.name).join(', ') : '없음'));
  train.results.forEach(r => dl.append(el('dt', null, '대회 ' + r.round), el('dd', null, r.place)));
  card.appendChild(dl);
  const b = el('button', 'btn', '처음부터 다시'); b.type = 'button'; b.style.marginTop = '18px';
  b.addEventListener('click', () => { $('#trainView').hidden = true; $('#tourView').hidden = true; $('#createView').hidden = false; resetAll(); resetHistory(); });
  card.appendChild(b); box.appendChild(card);
}

/* ============================================================
   지난 화면 보기 (보기 전용) — 결과는 바뀌지 않음
   화면이 넘어갈 때마다 그 화면을 사진처럼 저장하고, 뒤로가기(버튼·제스처)로 다시 볼 수 있음
   ============================================================ */
const hist = { run: 1, snaps: [], viewing: -1, live: null };
const VIEWS = ['createView', 'trainView', 'tourView'];
function liveView() { return VIEWS.map(id => document.getElementById(id)).find(v => !v.hidden) || null; }
function snap() {
  const v = liveView(); if (!v) return;
  const c = v.cloneNode(true);
  c.removeAttribute('id'); c.hidden = false;
  c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  c.querySelectorAll('input, button, select, textarea').forEach(e => { e.disabled = true; e.tabIndex = -1; });
  const h1 = v.querySelector('h1'), lede = v.querySelector('.lede');
  hist.snaps.push({ node: c, title: [h1 && h1.textContent, lede && lede.textContent].filter(Boolean).join(' · ') });
  history.pushState({ run: hist.run, i: hist.snaps.length }, '');
  renderHistNav();
}
function renderHistNav() { $('#histNav').hidden = !(hist.snaps.length && hist.viewing < 0); }
function showSnap(k) {
  if (hist.viewing < 0) { hist.live = liveView(); if (hist.live) hist.live.hidden = true; }
  hist.viewing = k;
  const sn = hist.snaps[k], body = $('#rvBody');
  body.textContent = ''; body.appendChild(sn.node);
  const tag = $('#rvTag'); tag.textContent = '지난 화면 ' + (k + 1) + ' / ' + hist.snaps.length;
  tag.appendChild(el('small', null, (sn.title ? sn.title + ' — ' : '') + '보기 전용이라 결과는 바뀌지 않습니다.'));
  $('#rvPrev').disabled = k === 0;
  $('#reviewView').hidden = false; renderHistNav();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function showLive() {
  if (hist.viewing < 0) return;
  hist.viewing = -1;
  $('#reviewView').hidden = true; $('#rvBody').textContent = '';
  if (hist.live) hist.live.hidden = false;
  hist.live = null; renderHistNav();
}
function resetHistory() {
  hist.run++; hist.snaps = []; hist.viewing = -1; hist.live = null;
  history.replaceState({ run: hist.run, i: 0 }, '');
  renderHistNav();
}
window.addEventListener('popstate', e => {
  const st = e.state;
  if (!st || st.run !== hist.run) {          // 이전 판의 기록이면 지금 화면에 머묾
    showLive();
    if (hist.snaps.length) history.pushState({ run: hist.run, i: hist.snaps.length }, '');
    return;
  }
  if (st.i >= hist.snaps.length) showLive(); else showSnap(st.i);
});
$('#navBack').addEventListener('click', () => history.back());
$('#rvPrev').addEventListener('click', () => history.back());
$('#rvNext').addEventListener('click', () => history.forward());
$('#rvLive').addEventListener('click', () => history.go(hist.snaps.length - hist.viewing));
// 진행 중에 창을 닫거나 새로고침하려 하면 한 번 확인
window.addEventListener('beforeunload', e => { if (hist.snaps.length) { e.preventDefault(); e.returnValue = ''; } });
history.replaceState({ run: hist.run, i: 0 }, '');

$('#roll').addEventListener('click', roll);
$('#make').addEventListener('click', showSheet);

bindName('#nameIn', '#nameCnt', 'name'); bindName('#styleIn', '#styleCnt', 'style'); buildGender(); buildChoices(); renderStats(); renderHistory(); renderCount(); renderMake();
</script>
