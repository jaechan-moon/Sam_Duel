<body>
<main class="wrap">
<nav class="histnav" id="histNav" hidden>
  <button type="button" class="btn nav" id="navBack">◀ 지난 화면 보기</button>
</nav>
<div id="reviewView" hidden>
  <div class="rv-bar">
    <p class="rv-tag" id="rvTag"></p>
    <div class="rv-btns">
      <button type="button" class="btn nav" id="rvPrev">◀ 이전</button>
      <button type="button" class="btn nav" id="rvNext">다음 ▶</button>
      <button type="button" class="btn primary nav" id="rvLive">지금 화면으로</button>
    </div>
  </div>
  <div class="review" id="rvBody"></div>
</div>
<div id="createView">
  <header>
    <h1>신무장 생성</h1>
    <button type="button" class="btn nav rank-open" id="rankBtn">🏆 랭킹 보기</button>
    <p class="lede">삼국지 일기토 시뮬레이터. 성별과 이름을 정하고, 주사위로 통솔·무력·지력을 정한 뒤, 개성과 사상을 고릅니다.</p>
  </header>

  <section class="block" aria-label="성별" id="genderSec" style="margin-top:0">
    <fieldset class="group">
      <legend>성별</legend>
      <div class="gender-opts" id="genderOpts"></div>
    </fieldset>
  </section>

  <section class="block" aria-label="이름" id="nameSec" style="margin-top:0">
    <fieldset class="group">
      <legend>이름</legend>
      <div class="name-row">
        <label class="fld"><span>이름</span>
          <input id="nameIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="예: 관우">
          <small class="cnt" id="nameCnt">0 / 4</small></label>
        <label class="fld"><span>자(字) <em>선택</em></span>
          <input id="styleIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="예: 운장">
          <small class="cnt" id="styleCnt">0 / 4</small></label>
      </div>
      <p class="fld-hint">이름과 자는 각각 최대 4글자(8바이트)입니다. 한글, 한자, 영문, 숫자를 쓸 수 있어요.</p>
      <p class="fld-hint" id="nameDefault"></p>
      <p class="fld-err" id="nameErr" role="alert" hidden></p>
    </fieldset>
  </section>

  <section class="block" aria-label="출신지" id="originSec" style="margin-top:0">
    <fieldset class="group">
      <legend>출신지</legend>
      <div class="origin-opts" id="originOpts"></div>
      <p class="fld-hint" id="fameLine"></p>
      <button type="button" class="btn" id="titleBtn">🏅 칭호 도감</button>
    </fieldset>
  </section>

  <section aria-label="능력치">
    <div class="slips" id="slips">
      <div class="slip"><span class="gauge"><i></i></span><div class="slip-name"><b><span>統</span><span>率</span></b><small>통솔</small></div><output class="slip-num">?</output></div>
      <div class="slip"><span class="gauge"><i></i></span><div class="slip-name"><b><span>武</span><span>力</span></b><small>무력</small></div><output class="slip-num">?</output></div>
      <div class="slip"><span class="gauge"><i></i></span><div class="slip-name"><b><span>智</span><span>力</span></b><small>지력</small></div><output class="slip-num">?</output></div>
    </div>

:"육도",desc:"여섯 가지 전략을 담은 태공의 병서.",effect:"통솔 +1, 지력 +1",eff:{stat:[1,0,1]}},{id:"oja",name:"오자",desc:"오기가 지은 용병의 지침서.",effect:"무력 +1, 통솔 +1",eff:{stat:[1,1,0]}},{id:"mukja",name:"묵자",desc:"굳게 지키고 널리 사랑하라는 가르침.",effect:"내가 받는 피해 ×0.985",eff:{taken:.985}},{id:"maengdeok",name:"맹덕신서",desc:"조조가 직접 쓴 병서.",effect:"지력 +1, 치명타 확률 +1%p",eff:{stat:[0,0,1],cr:.01}},{id:"hanbija",name:"한비자",desc:"법과 술수로 나라를 다스리는 책.",effect:"치명타 방어 확률 +18%p",eff:{cd:.18}},{id:"nonogo",name:"논어",desc:"덕과 예로 사람을 이끄는 공자의 말씀.",effect:"통솔 +1, 치명타 방어 확률 +8%p",eff:{stat:[1,0,0],cd:.08}},{id:"taepyeongcheong",name:"태평청령도",desc:"태평도의 비술이 적힌 신비한 도서.",effect:"회피 확률 +0.6%p, 치명타 방어 확률 +10%p",eff:{ev:.006,cd:.1}},{id:"taepyeongyo",name:"태평요술서",desc:"장각이 받았다는 도술서.",effect:"지력 +1, 상대 회피 확률 −0.6%p",eff:{stat:[0,0,1],oppEv:.006}}],_e=[{id:"gear",name:"병장기 구입",desc:"장터를 돌며 쓸 만한 무기와 갑옷을 알아보고 장비를 마련한다.",gain:.42,to:{0:.3,1:.7},evt:"장터 구석에서 낡은 병서 한 권을 발견했다."},{id:"martial",name:"무예 수련",desc:"연무장에서 땀이 흐를 때까지 창과 검을 휘두른다.",gain:.42,to:{1:1},evt:"수련 중 지나가던 노병이 쓸 만한 수를 일러 주었다."},{id:"drill",name:"병사 훈련",desc:"병사들을 불러 모아 대열을 짜고 호흡을 맞춘다.",gain:.42,to:{0:1},evt:"병사 하나가 집안에 전해 오는 비책을 귀띔해 주었다."},{id:"books",name:"병서 탐독",desc:"밤을 새워 병서를 읽으며 싸움의 이치를 되새긴다.",gain:.42,to:{2:1},evt:"책갈피 사이에서 앞선 이가 남긴 필사를 발견했다."},{id:"hunt",name:"사냥",desc:"산에 들어가 맹수를 쫓으며 실전 감각을 기른다.",gain:.42,to:{1:1},evt:"산짐승을 쫓다 낡은 병서를 주웠다."},{id:"spar",name:"고수와의 대련",desc:"이름난 무인을 찾아가 가르침을 청하고 겨루어 본다.",gain:.42,to:{1:1},evt:"대련을 마친 고수가 비전을 한 자락 일러 주었다."},{id:"mingle",name:"장수들과 교류",desc:"술자리를 열어 다른 무장들과 속마음을 나눈다.",gain:.42,to:{0:1},evt:"술자리에서 한 장수가 자신만의 수를 귀띔해 주었다."},{id:"patrol",name:"저잣거리 순찰",desc:"민심을 살피고 백성들의 이야기에 귀를 기울인다.",gain:.42,to:{0:.5,2:.5},evt:"저잣거리 노인에게서 뜻밖의 계책을 얻어 들었다."},{id:"hermit",name:"은사 방문",desc:"은거한 선비를 찾아가 천하의 정세를 묻는다.",gain:.42,to:{2:1},evt:"은사가 한 수 가르침을 남기고 떠났다."},{id:"mock",name:"모의 전투",desc:"병사들과 편을 나누어 모의 전투를 치르며 군을 지휘하는 법을 익힌다.",gain:.42,to:{0:.5,2:.5},evt:"모의 전투 중 뜻밖의 묘수가 떠올랐다."},{id:"horse",name:"말 길들이기",desc:"거친 야생마를 다독이며 말과 한 몸이 되는 법을 익힌다.",gain:.42,to:{0:.7,1:.3},evt:"마구간지기가 오래된 전법을 풀어 이야기했다."},{id:"temple",name:"산사 명상",desc:"고요한 산사에서 마음을 비우고 호흡을 가다듬는다.",gain:.42,to:{2:1},evt:"고요한 산사에서 스님이 뜻 모를 구절을 일러 주었다."}],Lt={gear:{prog:"장터를 돌며 쓸 만한 물건을 고르는 중…",ok:["상인이 숨겨 둔 좋은 물건을 알아보았다. 값은 비쌌지만 한 번 쥐어 보니 손에 착 감겼다.","녹슨 갑옷 사이에서 쓸 만한 한 벌을 건졌다. 입어 보니 몸놀림이 한결 가벼웠다.","대장장이와 흥정 끝에 날이 잘 선 물건을 얻었다. 장비를 고르는 눈도 한 뼘 자랐다."],no:["장터를 한참 돌았지만 마음에 드는 물건이 없었다. 눈만 높아진 하루였다.","값을 치르려는 순간 더 좋은 물건이 눈에 들어왔다. 다음엔 서두르지 말자고 다짐했다.","비싼 값만 부르는 상인에게서 돌아섰다. 빈손이었지만 장터 사정은 훤해졌다."]},martial:{prog:"연무장에서 창과 검을 휘두르는 중…",ok:["휘두른 창끝이 한결 날카로워졌다. 어제는 닿지 않던 곳까지 힘이 실린다.","한 번 더, 또 한 번 더 베어 내자 팔에 힘이 붙었다. 땀이 흘러도 칼끝은 흔들리지 않았다.","해가 질 때까지 쉬지 않고 연무장을 지켰다. 오늘의 땀이 내일의 일격이 되리라."],no:["오늘은 창이 말을 듣지 않았다. 내일은 다를 것이라 믿고 자리에서 일어났다.","땀만 흘렸지만 손에는 감각이 남았다. 자세를 다시 잡는 데 하루가 갔다.","무리하다 손목이 시큰거려 일찍 접었다. 쉬는 것도 수련이라 스스로를 달랬다."]},drill:{prog:"병사들을 불러 모아 대열을 짜는 중…",ok:["북소리에 맞춰 병사들이 한 몸처럼 움직였다. 이끄는 이의 목소리에도 힘이 실렸다.","흐트러지던 대열이 호령 한마디에 바로 섰다. 사람을 움직이는 법을 조금 알 것 같다.","해 질 녘까지 진을 짜고 풀기를 거듭했다. 병사들의 눈빛이 믿음으로 바뀌었다."],no:["호령이 엇갈려 대열이 한바탕 뒤엉켰다. 웃음 속에서도 배운 것은 있었다.","병사들이 지쳐 보여 조련을 일찍 거두었다. 이끄는 일은 쉽지 않다.","북소리와 구령이 맞지 않아 헛걸음만 했다. 다음엔 신호부터 정하기로 했다."]},books:{prog:"등불 아래 병서를 펼쳐 읽는 중…",ok:["한참을 곱씹던 구절이 갑자기 한눈에 풀렸다. 싸움의 이치가 한 칸 더 보인다.","밤을 새워 읽은 한 장이 머릿속에 선명히 남았다. 진세가 눈앞에 그려진다.","옛 장수의 계책을 따라 짚어 보며 무릎을 쳤다. 책 속의 지혜가 몸에 스며든다."],no:["등불이 흔들리는 사이 글자가 흐려졌다. 졸음을 이기지 못하고 책을 덮었다.","어려운 구절을 몇 번이나 읽었지만 뜻이 잡히지 않았다. 내일 다시 펼치기로 했다.","한참을 읽다 보니 어느새 새벽이었다. 머리는 무거웠지만 책 냄새가 싫지 않았다."]},hunt:{prog:"산에 들어가 맹수의 자취를 쫓는 중…",ok:["숨을 죽이고 기다리다 단숨에 짐승을 잡았다. 순간의 판단이 몸에 새겨졌다.","험한 산길을 달려 사냥감을 몰아세웠다. 다리와 팔에 새 힘이 붙은 느낌이다.","맹수와 눈이 마주친 순간에도 물러서지 않았다. 실전의 감각이 한층 살아났다."],no:["발자국만 따라가다 해가 저물었다. 빈손이었지만 산길은 눈에 익었다.","화살이 한 치 빗나가 사냥감을 놓쳤다. 다음엔 바람부터 읽어야겠다.","산짐승이 먼저 낌새를 채고 사라졌다. 이번엔 산이 한 수 위였다."]},spar:{prog:"이름난 무인과 마주 서서 겨루는 중…",ok:["단 한 합에 무기를 떨구고 말았지만 눈이 번쩍 뜨였다. 고수의 한마디가 큰 가르침이 되었다.","수십 합을 겨루며 상대의 수를 읽어 냈다. 막판에는 내 칼끝이 먼저 닿았다.",'대련이 끝나자 고수가 고개를 끄덕였다. "그만하면 쓸 만하다." 그 한마디가 약이 되었다.'],no:["상대의 기세에 눌려 제 실력을 보이지 못했다. 졌다는 사실만 또렷했다.","몇 합 만에 쓰러져 모래를 털고 일어났다. 아직 갈 길이 멀다.","고수는 웃기만 할 뿐 아무 말도 해 주지 않았다. 스스로 깨치라는 뜻이리라."]},mingle:{prog:"술잔을 기울이며 장수들과 이야기하는 중…",ok:["술잔이 몇 순배 돌자 속마음이 오갔다. 한 사람의 신뢰가 생겼다.","다른 장수의 전장 이야기에 귀를 기울였다. 사람을 헤아리는 눈이 한층 깊어졌다.","웃고 마시는 사이 서로를 알아 갔다. 곁에 둘 이들이 늘었다."],no:["분위기는 좋았지만 쓸 만한 이야기는 없었다. 머리만 아픈 아침이 되었다.","서먹한 자리에서 술만 비웠다. 마음을 여는 데는 시간이 걸린다.","말이 길어졌다가 괜한 실수를 했다. 다음엔 듣는 쪽에 서기로 했다."]},patrol:{prog:"저잣거리를 돌며 백성들의 이야기를 듣는 중…",ok:["백성들이 건네는 이야기에서 민심의 흐름을 읽었다. 다스림의 길이 조금 보인다.","다툼을 말리고 억울한 이의 사정을 들어 주었다. 사람을 이끄는 법을 배웠다.","장터 구석구석을 살피다 수상한 낌새를 먼저 알아챘다. 눈이 한결 밝아졌다."],no:["하루 종일 돌았지만 별일 없는 평온한 거리였다. 그것도 좋은 소식이다.","소란은 이미 가라앉은 뒤였다. 한발 늦었지만 다음엔 더 빨리 움직이리라.","사람들이 낯선 얼굴에 말을 아꼈다. 믿음을 얻는 데는 시간이 필요하다."]},hermit:{prog:"은거한 선비의 초가를 찾아 산길을 오르는 중…",ok:["은사가 차를 따르며 던진 한마디가 깊이 남았다. 천하의 흐름이 한눈에 그려진다.","문답을 주고받으며 막혔던 생각이 풀렸다. 돌아오는 길이 한결 가벼웠다.","은사는 많은 말 대신 바둑 한 판을 두었다. 수를 읽는 눈이 한 뼘 자랐다."],no:["은사는 산을 내려갔다고 했다. 빈 초가에서 바람 소리만 듣고 돌아왔다.",'"아직 때가 아니다." 은사는 그 한마디만 남겼다. 무슨 뜻인지 곱씹으며 내려왔다.',"찾아가는 길에서 길을 잃고 날이 저물었다. 산길이 가장 큰 가르침이었다."]},mock:{prog:"병사들과 편을 나누어 모의 전투를 치르는 중…",ok:["한 수 앞을 내다본 포진이 적중했다. 군을 움직이는 감이 조금 잡힌다.","퇴로를 열어 두고 적을 유인하자 모의 전투가 한 번에 끝났다. 판 전체가 눈에 들어왔다.","병사들이 호령 한마디에 일제히 움직였다. 지휘의 맛을 알게 된 하루였다."],no:["진형이 무너져 모의 전투에서 크게 졌다. 졌기에 보이는 허점도 있었다.","서로 엉켜 누가 이겼는지도 알 수 없는 싸움이었다. 먼지만 잔뜩 뒤집어썼다.","계책이 너무 뻔해서 병사들에게 들켜 버렸다. 다음엔 수를 숨겨야겠다."]},horse:{prog:"야생마의 고삐를 잡고 달래는 중…",ok:["날뛰던 말이 어느새 손길을 따랐다. 말과 숨을 맞추자 몸이 가벼워졌다.","수십 번 떨어지고도 다시 올랐다. 끝내 말이 먼저 고개를 숙였다.","바람을 가르며 말 위에서 한 몸이 되었다. 달리는 만큼 마음도 단단해졌다."],no:["말이 날뛰어 몇 번이고 땅바닥에 나뒹굴었다. 먼지 속에서도 웃음이 났다.","고삐를 쥐기도 전에 말이 달아나 버렸다. 아직 말과 마음이 맞지 않았다.","말의 눈빛이 매서워 가까이 다가가지 못했다. 서두르지 않기로 했다."]},temple:{prog:"고요한 산사에서 숨을 고르며 앉아 있는 중…",ok:["종소리가 잦아든 뒤에야 생각이 맑아졌다. 마음을 비우자 판세가 보인다.","스님이 건넨 한 구절이 오래도록 마음에 남았다. 복잡하던 생각이 가라앉았다.","고요 속에서 호흡을 가다듬자 머릿속이 맑아졌다. 하산하는 발걸음이 가벼웠다."],no:["자꾸 잡념이 떠올라 눈을 감고도 쉬지 못했다. 그래도 산바람은 시원했다.","졸다가 종소리에 놀라 눈을 떴다. 스님이 웃으며 차를 건넸다.","마음을 비우려 할수록 생각이 많아졌다. 비우는 것도 수련이라 했다."]}},$e={tip:"육성은 일정 확률로 능력치가 오릅니다. 오르지 않아도 게임이 멈춘 것이 아니며 다음 행
